<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="data:,">
	<title>2D Action RPG Canvas</title>
	<link rel="stylesheet" href="game.css">
</head>

<body>

	<!--デバッグ用-->
	<div id="debugInfo"></div>

	<canvas id="gameCanvas"></canvas>

	<!-- tw chat -->
	<div id="chatArea">
		<div id="chatTopBar"><img src="./assets/UI/ChatBar/topBar.png"></div>
		<div id="chatLog">
			<div id="chatLogText"></div>

			<div id="chatScrollArea">
				<img id="chatScrollUp" src="./assets/UI/ChatBar/scrollUp.png" alt="上へ">
				<div id="chatScrollTrack"><img src="./assets/UI/ChatBar/scrollBar.png" alt="つまみ"></div>
				<img id="chatScrollDown" src="./assets/UI/ChatBar/scrollDown.png" alt="下へ">
			</div>
		</div>
		<div id="chatUnder">
			<div id="chatOpen" class="chatBtn"></div>
			<div id="chatWhisperUser"></div>
			<div id="chatInput"></div>
			<div id="chatMail" class="chatBtn"></div>
			<div id="chatMemo" class="chatBtn"></div>
			<div id="chatMessanger" class="chatBtn"></div>
			<div id="chatDM" class="chatBtn"></div>
			<div id="chatFixedText" class="chatBtn"></div>
			<div id="chatEmote" class="chatBtn"></div>
		</div>
	</div>

	<!-- 最後に書く -->
	<script type="module" src="./game.js"></script>
</body>

</html>
