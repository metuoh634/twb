<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="data:,">
	<title>2D Action RPG Canvas</title>
	<link rel="stylesheet" href="game.css">
</head>

<body>

	<!--デバッグ用-->
	<div id="debugInfo"></div>

	<canvas id="gameCanvas"></canvas>


	<!--チャットバー-->
	<div id="chat-container">
		<div id="chat-header">チャット<button id="chat-close-btn">×</button></div>
		<div id="chat-log"></div>
		<div id="chat-input-area">
			<input type="text" id="chat-input" placeholder="メッセージを入力...（Enterで送信）" maxlength="50">
			<button id="chat-send-btn">送信</button>
		</div>
	</div>

	<!-- 最後に書く -->
	<script type="module" src="./game.js"></script>
</body>

</html>
